# Single source of truth for this repo's toolchain versions.
#
# CI (.github/workflows/ci.yml) provisions these same versions via
# jdx/mise-action, so a bump here propagates to local dev and CI together.
# Run `mise install` to sync your machine.

[tools]

# Must stay >= the `go` line in go.mod.
go = "1.27.1"

# Must satisfy BOTH `engines.node` and `engines.npm` in package.json using the
# npm it bundles (CI and publish-ts-client.yml never upgrade npm separately).
# 24.21.0 bundles npm 11.19.0; renovate.json stops engines.npm drifting past it.
node = "24.21.0"

golangci-lint = "2.13.2"

buf = "1.32.1"
# Spec Kit CLI (local dev only; CI jobs pass explicit install_args to skip it).
"pipx:specify-cli" = "1.0.11"
