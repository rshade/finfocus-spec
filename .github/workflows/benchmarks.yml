name: Performance Benchmarks

env:
  # Keep in step with .github/workflows/ci.yml; see the comment there.
  MISE_VERSION: '2026.9.2'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up toolchain
        uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
          # buf is needed by `make generate`, which previously fell back to the
          # Makefile's own pinned download.
          install_args: go buf

      - name: Generate Go SDK
        run: make generate

      - name: Download Go module dependencies
        run: go mod download

      - name: Run benchmarks
        # Run benchmarks in all subdirectories under sdk/go
        run: go test -bench=. -benchmem ./sdk/go/... | tee benchmark_results.txt

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Go Benchmark
          tool: 'go'
          output-file-path: benchmark_results.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: 'benchmark-data'
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # CI environments have high variance (2x+ for sub-microsecond ops)
          # See issue #224 for analysis
          alert-threshold: '150%'  # 50% tolerance for CI variability
          comment-on-alert: true
          # Don't fail builds on benchmark variance - informational only
          # CI runners have inherent variability that causes false positives
          fail-on-alert: false
          summary-always: true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark_results.txt
