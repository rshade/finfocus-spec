syntax = "proto3";

package finfocus.v1;

option go_package = "github.com/rshade/finfocus-spec/sdk/go/proto/finfocus/v1;pbc";

// FocusServiceCategory represents the standard service classifications
// defined in FinOps FOCUS 1.2.
enum FocusServiceCategory {
  FOCUS_SERVICE_CATEGORY_UNSPECIFIED = 0;
  FOCUS_SERVICE_CATEGORY_COMPUTE = 1;
  FOCUS_SERVICE_CATEGORY_STORAGE = 2;
  FOCUS_SERVICE_CATEGORY_NETWORK = 3;
  FOCUS_SERVICE_CATEGORY_DATABASE = 4;
  FOCUS_SERVICE_CATEGORY_ANALYTICS = 5;
  FOCUS_SERVICE_CATEGORY_MACHINE_LEARNING = 6;
  FOCUS_SERVICE_CATEGORY_MANAGEMENT = 7;
  FOCUS_SERVICE_CATEGORY_SECURITY = 8;
  FOCUS_SERVICE_CATEGORY_DEVELOPER_TOOLS = 9;
  FOCUS_SERVICE_CATEGORY_OTHER = 10;
}

// FocusChargeCategory represents the nature of the charge.
enum FocusChargeCategory {
  FOCUS_CHARGE_CATEGORY_UNSPECIFIED = 0;
  FOCUS_CHARGE_CATEGORY_USAGE = 1;
  FOCUS_CHARGE_CATEGORY_PURCHASE = 2;
  FOCUS_CHARGE_CATEGORY_CREDIT = 3;
  FOCUS_CHARGE_CATEGORY_TAX = 4;
  FOCUS_CHARGE_CATEGORY_REFUND = 5;
  FOCUS_CHARGE_CATEGORY_ADJUSTMENT = 6;
}

// FocusPricingCategory represents the pricing model applied.
// FOCUS 1.2 Section 2.4: Pricing Category
enum FocusPricingCategory {
  FOCUS_PRICING_CATEGORY_UNSPECIFIED = 0;
  FOCUS_PRICING_CATEGORY_STANDARD = 1;
  FOCUS_PRICING_CATEGORY_COMMITTED = 2;
  FOCUS_PRICING_CATEGORY_DYNAMIC = 3;
  FOCUS_PRICING_CATEGORY_OTHER = 4;
}

// FocusChargeClass represents the classification of charges.
// FOCUS 1.2 Section 2.4: Charge Class (New in 1.0+)
enum FocusChargeClass {
  FOCUS_CHARGE_CLASS_UNSPECIFIED = 0;
  FOCUS_CHARGE_CLASS_REGULAR = 1;
  FOCUS_CHARGE_CLASS_CORRECTION = 2;
}

// FocusChargeFrequency represents how often a charge is applied.
// FOCUS 1.2 Section 2.4: Charge Frequency
enum FocusChargeFrequency {
  FOCUS_CHARGE_FREQUENCY_UNSPECIFIED = 0;
  FOCUS_CHARGE_FREQUENCY_ONE_TIME = 1;
  FOCUS_CHARGE_FREQUENCY_RECURRING = 2;
  FOCUS_CHARGE_FREQUENCY_USAGE_BASED = 3;
}

// FocusCommitmentDiscountCategory represents the type of commitment discount.
// FOCUS 1.2 Section 2.6: Commitment Discounts
enum FocusCommitmentDiscountCategory {
  FOCUS_COMMITMENT_DISCOUNT_CATEGORY_UNSPECIFIED = 0;
  FOCUS_COMMITMENT_DISCOUNT_CATEGORY_SPEND = 1;
  FOCUS_COMMITMENT_DISCOUNT_CATEGORY_USAGE = 2;
}

// FocusCommitmentDiscountStatus represents the utilization status of a
// commitment discount. FOCUS 1.2 Section 3.17: Commitment Discount Status
enum FocusCommitmentDiscountStatus {
  FOCUS_COMMITMENT_DISCOUNT_STATUS_UNSPECIFIED = 0;
  // Used: Charges utilizing a specific commitment discount amount.
  FOCUS_COMMITMENT_DISCOUNT_STATUS_USED = 1;
  // Unused: Charges representing the unused portion of a commitment discount.
  FOCUS_COMMITMENT_DISCOUNT_STATUS_UNUSED = 2;
}

// FocusCapacityReservationStatus represents the utilization status of a
// capacity reservation. FOCUS 1.2 Section 3.7: Capacity Reservation Status
enum FocusCapacityReservationStatus {
  FOCUS_CAPACITY_RESERVATION_STATUS_UNSPECIFIED = 0;
  // Used: Charges utilizing a specific capacity reservation amount.
  FOCUS_CAPACITY_RESERVATION_STATUS_USED = 1;
  // Unused: Charges representing the unused portion of a capacity reservation.
  FOCUS_CAPACITY_RESERVATION_STATUS_UNUSED = 2;
}

// FieldSupportStatus represents the support status of a FOCUS field for a given
// resource type in dry-run introspection. Used in DryRunResponse to indicate whether
// a plugin can populate specific fields for a queried resource type.
//
// Usage in dry-run responses:
//   - SUPPORTED: Field is always populated for this resource type
//   - UNSUPPORTED: Field is never populated (e.g., K8s-specific fields on AWS)
//   - CONDITIONAL: Field depends on resource configuration (provide condition_description)
//   - DYNAMIC: Field requires runtime data to determine (provide condition_description)
enum FieldSupportStatus {
  // Default value - unknown or not determined.
  // Should not be used in well-formed responses; indicates incomplete implementation.
  FIELD_SUPPORT_STATUS_UNSPECIFIED = 0;

  // Field is always populated for this resource type.
  // Example: service_category is always available for compute resources.
  FIELD_SUPPORT_STATUS_SUPPORTED = 1;

  // Field is never populated for this resource type.
  // Example: kubernetes-specific fields on AWS EC2 resources.
  FIELD_SUPPORT_STATUS_UNSUPPORTED = 2;

  // Field is populated based on resource configuration or provider settings.
  // When using this status, condition_description MUST explain the condition.
  // Example: availability_zone only populated for regional resources in multi-AZ providers.
  FIELD_SUPPORT_STATUS_CONDITIONAL = 3;

  // Field requires runtime data to determine value; cannot be fully introspected.
  // When using this status, condition_description SHOULD explain what data is needed.
  // Example: actual billed_cost values require querying billing APIs.
  FIELD_SUPPORT_STATUS_DYNAMIC = 4;
}

// GrowthType represents the mathematical model used for projecting cost growth.
// Used in ResourceDescriptor and GetProjectedCostRequest for forward-looking projections.
enum GrowthType {
  // Default value - treated identically to GROWTH_TYPE_NONE.
  // When unset, no growth is applied to projections.
  GROWTH_TYPE_UNSPECIFIED = 0;

  // No growth applied to projections.
  // Cost projections remain constant at the base cost.
  GROWTH_TYPE_NONE = 1;

  // Linear (additive) growth per projection period.
  // Formula: cost_at_n = base_cost * (1 + rate * n)
  // Requires growth_rate to be set.
  GROWTH_TYPE_LINEAR = 2;

  // Exponential (compounding) growth per projection period.
  // Formula: cost_at_n = base_cost * (1 + rate)^n
  // Requires growth_rate to be set.
  GROWTH_TYPE_EXPONENTIAL = 3;
}

// RecommendationReason represents the standardized reason code for a recommendation.
enum RecommendationReason {
  RECOMMENDATION_REASON_UNSPECIFIED = 0;
  // Resource capacity significantly exceeds utilization.
  RECOMMENDATION_REASON_OVER_PROVISIONED = 1;
  // Resource capacity is insufficient for the workload (Performance).
  RECOMMENDATION_REASON_UNDER_PROVISIONED = 2;
  // Resource is active but has no significant utilization.
  RECOMMENDATION_REASON_IDLE = 3;
  // Resource provides duplicate functionality (e.g., unused IP).
  RECOMMENDATION_REASON_REDUNDANT = 4;
  // Resource uses an older hardware generation (e.g., AWS t2 vs t3).
  RECOMMENDATION_REASON_OBSOLETE_GENERATION = 5;
}

// PluginCapability represents discrete features a plugin can provide.
// Used by consuming applications for intelligent plugin routing and selection.
// Plugins report supported capabilities via GetPluginInfo or SupportsResponse.
enum PluginCapability {
  PLUGIN_CAPABILITY_UNSPECIFIED = 0;
  // Plugin implements GetProjectedCost RPC for cost estimation
  PLUGIN_CAPABILITY_PROJECTED_COSTS = 1;
  // Plugin implements GetActualCost RPC for historical cost data
  PLUGIN_CAPABILITY_ACTUAL_COSTS = 2;
  // Plugin supports carbon/sustainability metrics (METRIC_KIND_CARBON_FOOTPRINT)
  PLUGIN_CAPABILITY_CARBON = 3;
  // Plugin implements GetRecommendations RPC (existing "recommendations" capability)
  PLUGIN_CAPABILITY_RECOMMENDATIONS = 4;
  // Plugin implements DryRun RPC (existing "dry_run" capability)
  PLUGIN_CAPABILITY_DRY_RUN = 5;
  // Plugin implements GetBudgets RPC (existing "budgets" capability)
  PLUGIN_CAPABILITY_BUDGETS = 6;
  // Plugin supports energy consumption metrics (METRIC_KIND_ENERGY_CONSUMPTION)
  PLUGIN_CAPABILITY_ENERGY = 7;
  // Plugin supports water usage metrics (METRIC_KIND_WATER_USAGE)
  PLUGIN_CAPABILITY_WATER = 8;
  // Plugin implements GetPricingSpec RPC
  PLUGIN_CAPABILITY_PRICING_SPEC = 9;
  // Plugin implements EstimateCost RPC
  PLUGIN_CAPABILITY_ESTIMATE_COST = 10;
  // Plugin implements DismissRecommendation RPC
  PLUGIN_CAPABILITY_DISMISS_RECOMMENDATIONS = 11;
  // Plugin implements BatchCost RPC for efficient multi-resource cost queries
  PLUGIN_CAPABILITY_BATCH_COST = 12;
}

// UsageProfile represents the intended workload context for cost estimation.
// Plugins use this to apply profile-appropriate defaults to cost calculations
// and recommendations.
//
// Usage:
//   - Core sets usage_profile in requests based on CLI flags (--profile=dev)
//   - Plugins apply profile-specific behavior (e.g., reduced utilization for DEV)
//   - Unknown values are treated as UNSPECIFIED for forward compatibility
//
// Plugin Implementation Guidelines:
//   - MUST treat unknown values as UNSPECIFIED (graceful degradation)
//   - SHOULD log at WARN level when unknown values are normalized
//   - SHOULD log at INFO level when profile-specific behavior is applied
//   - SHOULD document profile-specific behavior in plugin documentation
//   - MAY use profile to influence recommendation priorities
enum UsageProfile {
  // Default value - no preference stated.
  // Plugins apply their standard estimation behavior.
  // Backward compatible with requests that don't specify a profile.
  USAGE_PROFILE_UNSPECIFIED = 0;

  // Production workload intent.
  // Plugins should assume:
  //   - Full-time utilization (730 hours/month for compute)
  //   - Production-grade instance types
  //   - High availability and redundancy considerations
  //   - Longer retention periods for storage
  USAGE_PROFILE_PROD = 1;

  // Development workload intent.
  // Plugins should assume:
  //   - Reduced utilization (e.g., 160 hours/month for business hours)
  //   - Burstable/cost-efficient instance types preferred
  //   - Minimal redundancy requirements
  //   - Shorter retention periods acceptable
  USAGE_PROFILE_DEV = 2;

  // Burst/temporary workload intent.
  // Plugins should assume:
  //   - High-intensity, short-duration usage
  //   - Scale-out architectures
  //   - Elevated data transfer/network costs
  //   - Batch processing or load testing scenarios
  USAGE_PROFILE_BURST = 3;
}

// CostQueryType specifies which cost operation to perform in a batch query.
// Used by BatchCostRequest to select the underlying cost RPC for all resources.
enum CostQueryType {
  // Default value; treated as ESTIMATE for backward compatibility.
  COST_QUERY_TYPE_UNSPECIFIED = 0;
  // Use EstimateCost logic for each resource (pre-deployment estimates).
  COST_QUERY_TYPE_ESTIMATE = 1;
  // Use GetActualCost logic for each resource (historical cost data).
  // Requires start/end timestamps in BatchCostRequest.
  COST_QUERY_TYPE_ACTUAL = 2;
  // Use GetProjectedCost logic for each resource (cost projections).
  COST_QUERY_TYPE_PROJECTED = 3;
}
